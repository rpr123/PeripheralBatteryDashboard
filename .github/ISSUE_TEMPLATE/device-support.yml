name: New device support
description: Request support for one or more peripherals that are not detected yet.
title: "[Device(s)] "
labels: [device-support]
body:
  - type: markdown
    attributes:
      value: |
        Do not post a device serial number or a full Windows HID device path.
        Unknown HID commands and command fuzzing are not accepted.
  - type: textarea
    id: devices
    attributes:
      label: Devices and connection methods
      description: List every requested device on a separate line with the manufacturer, exact model or revision, and the connection method actually used.
      placeholder: |
        Example Brand Model Rev A — 2.4 GHz USB dongle
        Example Brand Model 2 — Bluetooth
    validations:
      required: true
  - type: textarea
    id: observed_behavior
    attributes:
      label: Observed behavior (optional)
      description: Add a per-device symptom only when an existing reading is missing, wrong, or intermittent. It is not required for a new support request.
  - type: textarea
    id: firmware_versions
    attributes:
      label: Firmware versions (optional)
      description: List a device and firmware version per line when known.
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: If a local agent produced redacted inventory or diagnostics, paste it here. Remove serial numbers and full device paths first.
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: Battery protocol evidence
      description: Official documentation, open-source implementation, or a read-only capture. Do not attach private vendor software.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed serial numbers and full device paths.
          required: true
        - label: I understand that a new dongle protocol may require manual research and cannot be inferred from VID/PID alone.
          required: true
